<section class="filters">
  <div class="filters-container container">
    <form class="filters-form">
      <label class="filters-search">
        <svg class="filters-search-icon" width="18" height="18">
          <use href="./img/icons/sprite.svg#icon-search"></use>
        </svg>
        <input
          class="filters-input"
          type="text"
          name="search"
          placeholder="Search coin"
          autocomplete="off"
        />
      </label>
      <select class="filters-select" name="sort">
        <option value="market_cap">Market cap</option>
        <option value="price">Price</option>
        <option value="change">24h change</option>
        <option value="difference">Difference</option>
      </select>
      <label class="filters-checkbox">
        <input class="filters-checkbox-input" type="checkbox" name="onchain" />
        <span class="filters-checkbox-text">Only with Uniswap pool</span>
      </label>
      <button class="filters-refresh-btn" type="button">Refresh</button>
    </form>
    <p class="filters-status">
      Updated at <span class="filters-updated">—</span>
    </p>
  </div>
</section>
