<section class="hero">
  <div class="hero-container container">
    <h1 class="hero-title">Crypto prices from the market and from the chain</h1>
    <p class="hero-text">
      CoinGecko shows the market price of a coin. The on-chain price is
      calculated from the reserves of Uniswap V2 pools on Ethereum mainnet, so
      you can compare them.
    </p>
    <ul class="hero-stats">
      <li class="hero-stats-item">
        <span class="hero-stats-label">ETH price (Uniswap)</span>
        <span class="hero-stats-value" data-stat="eth-price">—</span>
      </li>
      <li class="hero-stats-item">
        <span class="hero-stats-label">Gas price</span>
        <span class="hero-stats-value" data-stat="gas-price">—</span>
      </li>
      <li class="hero-stats-item">
        <span class="hero-stats-label">Latest block</span>
        <span class="hero-stats-value" data-stat="block-number">—</span>
      </li>
      <li class="hero-stats-item">
        <span class="hero-stats-label">Pools tracked</span>
        <span class="hero-stats-value" data-stat="pools-count">—</span>
      </li>
    </ul>
  </div>
</section>
